# generated by md3 (matugen) — шаблон: ~/.config/md3/templates/mako.conf
font=Google Sans Flex, Google Sans 11
background-color={{colors.surface_container_high.default.hex}}
text-color={{colors.on_surface.default.hex}}
border-color={{colors.outline_variant.default.hex}}
progress-color=over {{colors.primary_container.default.hex}}
border-size=0
border-radius=28
width=360
height=140
padding=18
margin=8,12,12,12
default-timeout=5000
ignore-timeout=0
anchor=top-right
layer=overlay
max-visible=4
max-history=20
history=1
actions=1
on-button-left=invoke-default-action
on-button-middle=exec makoctl menu -n "" -- fuzzel --dmenu --prompt="notification > "
on-button-right=dismiss
max-icon-size=40
icons=1
markup=1

[urgency=high]
background-color={{colors.error_container.default.hex}}
text-color={{colors.on_error_container.default.hex}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
